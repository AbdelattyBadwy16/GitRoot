[package]
name = "sprout"
version = "0.1.0"
description = "GitRoot — a desktop git client that explains what it does"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "sprout"
path = "src/main.rs"
